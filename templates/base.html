<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}FreshCart{% endblock %} — POS</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script>
    // Apply saved theme before paint, to avoid a flash of the wrong theme.
    (function () {
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  {% if g.user %}
  <nav class="topnav">
    <div class="container nav-inner">
      <a href="{{ url_for('main.dashboard') }}" class="nav-brand">
        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </span>
        FreshCart
      </a>
      <div class="nav-links">
        <a href="{{ url_for('main.dashboard') }}" class="{{ 'active' if request.endpoint == 'main.dashboard' }}">Dashboard</a>
        <a href="{{ url_for('main.products_page') }}" class="{{ 'active' if request.endpoint == 'main.products_page' }}">Products</a>
        <a href="{{ url_for('main.billing_page') }}" class="{{ 'active' if request.endpoint == 'main.billing_page' }}">Billing</a>
        <a href="{{ url_for('main.orders_page') }}" class="{{ 'active' if request.endpoint in ['main.orders_page', 'main.order_detail'] }}">Orders</a>
      </div>
      <div class="nav-user">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          <span id="theme-toggle-icon"></span>
        </button>
        <a href="{{ url_for('main.settings') }}" class="dim" style="font-weight:600;">{{ g.user['username'] }}</a>
        <a href="{{ url_for('auth.logout') }}" class="btn btn-sm">Logout</a>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="container page">
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
